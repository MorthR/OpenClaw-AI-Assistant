<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenClaw AI Personal Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .chips-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
            padding: 0 5px;
        }
        .chip-btn {
            background-color: #eef2ff;
            color: #4f46e5;
            border: 1px solid #c7d2fe;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip-btn:hover {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .inline-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .inline-choice-btn {
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .inline-choice-btn:hover {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <div id="login-view" class="view-container">
        <div class="login-card">
            <div class="logo-area">
                <h2>OpenClaw AI</h2>
                <p>Personal Assistant with Email & Calendar Agent</p>
            </div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="userEmail">Email Address</label>
                    <input type="email" id="userEmail" required>
                </div>

                <div class="form-group">
                    <label for="authCode">Authorization Code</label>
                    <input type="password" id="authCode" required>
                </div>

                <button type="submit" class="btn-login">Start Chat</button>
            </form>
            <p class="login-tips">Your credentials are stored locally in your browser and used only to fetch/send emails via agent tools.</p>
        </div>
    </div>

    <div id="chat-view" class="view-container" style="display: none;">
        <div class="header-container">
            <div class="header-info">
                <h2>OpenClaw Assistant</h2>
                <span id="currentUserDisplay" class="user-badge">user@example.com</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()" title="Log out and clear credentials">Logout</button>
        </div>
        <div id="chat-box"></div>
        <div id="chips-area" class="chips-container"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Send a message or enter a command..." onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chipsArea = document.getElementById('chips-area');
        const userInput = document.getElementById('userInput');
        
        let lastActivityTime = Date.now();
        let isGenerating = false;
        let isUserFocusedOnInput = false;

        const defaultChips = [
            "Check recent email details",
            "Recommend schedule from emails",
            "List my calendar"
        ];

        userInput.addEventListener('focus', () => { isUserFocusedOnInput = true; });
        userInput.addEventListener('blur', () => { isUserFocusedOnInput = false; });
        userInput.addEventListener('input', () => { lastActivityTime = Date.now(); });

        ['mousemove', 'click', 'scroll'].forEach(evt => {
            window.addEventListener(evt, () => { lastActivityTime = Date.now(); });
        });

        function initApp() {
            const email = localStorage.getItem('user_email');
            const authCode = localStorage.getItem('user_auth_code');

            if (email && authCode) {
                showChatView(email);
            } else {
                showLoginView();
            }

            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        }

        function showLoginView() {
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('chat-view').style.display = 'none';
        }

        function showChatView(email) {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('currentUserDisplay').innerText = email;
            
            renderChips(defaultChips);

            if (chatBox.children.length === 0) {
                loadHistoryAndProactiveSuggestions(false);
            }

            startBackgroundWatchers();
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const authCode = document.getElementById('authCode').value.trim();

            if (!email || !authCode) {
                alert("Please enter both email and authorization code.");
                return;
            }

            localStorage.setItem('user_email', email);
            localStorage.setItem('user_auth_code', authCode);

            showChatView(email);
        }

        function handleLogout() {
            if (confirm("Are you sure you want to log out? Local credentials will be cleared.")) {
                localStorage.removeItem('user_email');
                localStorage.removeItem('user_auth_code');
                document.getElementById('userEmail').value = '';
                document.getElementById('authCode').value = '';
                chatBox.innerHTML = '';
                chipsArea.innerHTML = '';
                showLoginView();
            }
        }

        async function loadHistoryAndProactiveSuggestions(isIdlePulse = false) {
            try {
                if (!isIdlePulse) {
                    const res = await fetch('/api/history');
                    const data = await res.json();
                    data.history.forEach(item => appendMessage(item.role, item.content));
                }

                const email = localStorage.getItem('user_email') || '';
                const authCode = localStorage.getItem('user_auth_code') || '';

                const suggestRes = await fetch(`/api/proactive-suggestions?email=${encodeURIComponent(email)}&auth_code=${encodeURIComponent(authCode)}&is_idle_pulse=${isIdlePulse}`);
                const suggestData = await suggestRes.json();
                
                if (suggestData.greeting) {
                    appendMessage('assistant', suggestData.greeting, suggestData.inline_choices || []);
                }
                
                if (suggestData.suggested_chips && suggestData.suggested_chips.length > 0) {
                    renderChips(suggestData.suggested_chips);
                }
            } catch (err) {
                console.error("Failed to load history or proactive suggestions:", err);
            }
        }

        function renderChips(chips = []) {
            chipsArea.innerHTML = '';
            chips.forEach(chipText => {
                const btn = document.createElement('button');
                btn.className = 'chip-btn';
                btn.innerText = chipText;
                btn.onclick = () => {
                    userInput.value = chipText;
                    send();
                };
                chipsArea.appendChild(btn);
            });
        }

        function appendMessage(role, text = '', inlineChoices = []) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${role}`;

            const nameDiv = document.createElement('div');
            nameDiv.className = 'sender-name';
            nameDiv.innerText = role === 'user' ? 'Me' : 'OpenClaw AI';

            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerText = text;

            if (inlineChoices && inlineChoices.length > 0) {
                const choicesContainer = document.createElement('div');
                choicesContainer.className = 'inline-buttons-container';
                
                inlineChoices.forEach(choiceText => {
                    const btn = document.createElement('button');
                    btn.className = 'inline-choice-btn';
                    btn.innerText = `👉 ${choiceText}`;
                    btn.onclick = () => {
                        userInput.value = choiceText;
                        send();
                    };
                    choicesContainer.appendChild(btn);
                });
                
                msgDiv.appendChild(choicesContainer);
            }

            wrapper.appendChild(nameDiv);
            wrapper.appendChild(msgDiv);
            
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            return msgDiv;
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;

            lastActivityTime = Date.now();
            isGenerating = true;

            appendMessage('user', text);
            userInput.value = '';

            const assistantMsgDiv = appendMessage('assistant', '');
            const email = localStorage.getItem('user_email') || '';
            const authCode = localStorage.getItem('user_auth_code') || '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        session_id: "default_user",
                        email: email,
                        auth_code: authCode
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    assistantMsgDiv.innerText += chunk;
                    
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (error) {
                assistantMsgDiv.innerText = "[Network Error or Streaming Interrupted]";
                console.error("Streaming error:", error);
            } finally {
                isGenerating = false;
                lastActivityTime = Date.now();
            }
        }

        function hasRecentGreetingInLastThree() {
            const messages = Array.from(chatBox.querySelectorAll('.msg'));
            const lastThree = messages.slice(-3);
            return lastThree.some(msg => {
                const text = msg.innerText;
                return text.includes("Welcome back") || text.includes("System Pulse Check") || text.includes("Remaining events today");
            });
        }

        function startBackgroundWatchers() {
            setInterval(async () => {
                try {
                    const res = await fetch('/api/reminders/pending');
                    const data = await res.json();

                    if (data.alerts && data.alerts.length > 0) {
                        data.alerts.forEach(alert => {
                            const alertMsg = `AUTOMATIC REMINDER ALERT (${alert.time})\n[${alert.category}] ${alert.title}`;
                            appendMessage('assistant', alertMsg);

                            if ('Notification' in window && Notification.permission === 'granted') {
                                new Notification("OpenClaw Reminder Alert", {
                                    body: `[${alert.category}] ${alert.title} at ${alert.time}`
                                });
                            }
                        });
                    }
                } catch (err) {
                    console.error("Error polling reminder alerts:", err);
                }
            }, 5000);

            setInterval(() => {
                const idleDuration = (Date.now() - lastActivityTime) / 1000;
                
                if (idleDuration >= 30 && !isGenerating && !isUserFocusedOnInput && userInput.value.trim() === '') {
                    if (!hasRecentGreetingInLastThree()) {
                        loadHistoryAndProactiveSuggestions(true);
                    }
                    lastActivityTime = Date.now();
                }
            }, 10000);
        }

        initApp();
    </script>
</body>
</html>
